name: kala_ams
description: "Kala Attendance Management System - A simple, fast attendance app for employees"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  http: ^1.2.1
  
  # Camera access
  camera: ^0.11.0+2
  
  # Local storage for session
  shared_preferences: ^2.2.3
  
  # Date formatting
  intl: ^0.19.0
  
  # File paths
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Image display
  cached_network_image: ^3.3.1
  
  # Icons
  cupertino_icons: ^1.0.8

  # Charts for metals dashboard
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
